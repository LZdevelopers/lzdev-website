<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" fill="none">
  <!-- LZdev · Código limpo — editor com indentação regular e revisão aprovada.
       Acento: ciano categórico (cat-2). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141821" />
      <stop offset="1" stop-color="#05060a" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" stroke="#ffffff" stroke-opacity=".05" />
    </pattern>
    <radialGradient id="glow" cx=".5" cy="0" r=".85">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".2" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".42" r=".72">
      <stop offset=".5" stop-color="#05060a" stop-opacity="0" />
      <stop offset="1" stop-color="#05060a" stop-opacity=".7" />
    </radialGradient>
  </defs>

  <rect width="800" height="440" fill="url(#bg)" />
  <rect width="800" height="440" fill="url(#grid)" />
  <rect width="800" height="440" fill="url(#glow)" />

  <!-- janela do editor -->
  <rect x="140" y="66" width="520" height="308" rx="16" fill="#0a0c11" stroke="#ffffff" stroke-opacity=".12" />
  <path d="M140 110h520" stroke="#ffffff" stroke-opacity=".08" />
  <g fill="#ffffff" fill-opacity=".16">
    <circle cx="168" cy="88" r="4.5" />
    <circle cx="186" cy="88" r="4.5" />
    <circle cx="204" cy="88" r="4.5" />
  </g>
  <rect x="230" y="76" width="94" height="24" rx="7" fill="#ffffff" fill-opacity=".05" />
  <rect x="243" y="85" width="52" height="6" rx="3" fill="#ffffff" fill-opacity=".2" />

  <!-- medianiz e numeração -->
  <path d="M196 110v264" stroke="#ffffff" stroke-opacity=".06" />
  <g fill="#ffffff" fill-opacity=".12">
    <rect x="170" y="131" width="12" height="4" rx="2" />
    <rect x="170" y="157" width="12" height="4" rx="2" />
    <rect x="170" y="183" width="12" height="4" rx="2" />
    <rect x="170" y="209" width="12" height="4" rx="2" />
    <rect x="170" y="235" width="12" height="4" rx="2" />
    <rect x="170" y="261" width="12" height="4" rx="2" />
    <rect x="170" y="287" width="12" height="4" rx="2" />
    <rect x="170" y="313" width="12" height="4" rx="2" />
    <rect x="170" y="339" width="12" height="4" rx="2" />
  </g>

  <!-- guias de indentação -->
  <g stroke="#ffffff" stroke-opacity=".07" stroke-dasharray="3 6">
    <path d="M234 146v196M258 172v144" />
  </g>

  <!-- linhas de código: recuo constante, blocos que fecham -->
  <g rx="4.5">
    <rect x="212" y="128" width="46" height="9" rx="4.5" fill="#22d3ee" fill-opacity=".85" />
    <rect x="268" y="128" width="92" height="9" rx="4.5" fill="#ffffff" fill-opacity=".3" />
    <rect x="370" y="128" width="58" height="9" rx="4.5" fill="#ffffff" fill-opacity=".12" />

    <rect x="236" y="154" width="70" height="9" rx="4.5" fill="#ffffff" fill-opacity=".2" />
    <rect x="316" y="154" width="40" height="9" rx="4.5" fill="#22d3ee" fill-opacity=".55" />
    <rect x="366" y="154" width="112" height="9" rx="4.5" fill="#ffffff" fill-opacity=".12" />

    <rect x="260" y="180" width="120" height="9" rx="4.5" fill="#ffffff" fill-opacity=".16" />
    <rect x="390" y="180" width="52" height="9" rx="4.5" fill="#ffffff" fill-opacity=".1" />

    <rect x="260" y="206" width="34" height="9" rx="4.5" fill="#22d3ee" fill-opacity=".5" />
    <rect x="304" y="206" width="150" height="9" rx="4.5" fill="#ffffff" fill-opacity=".16" />

    <rect x="236" y="232" width="60" height="9" rx="4.5" fill="#ffffff" fill-opacity=".2" />
    <rect x="306" y="232" width="92" height="9" rx="4.5" fill="#ffffff" fill-opacity=".1" />

    <rect x="212" y="258" width="20" height="9" rx="4.5" fill="#ffffff" fill-opacity=".14" />

    <rect x="212" y="310" width="46" height="9" rx="4.5" fill="#22d3ee" fill-opacity=".85" />
    <rect x="268" y="310" width="110" height="9" rx="4.5" fill="#ffffff" fill-opacity=".3" />

    <rect x="236" y="336" width="132" height="9" rx="4.5" fill="#ffffff" fill-opacity=".16" />
    <rect x="378" y="336" width="58" height="9" rx="4.5" fill="#ffffff" fill-opacity=".1" />
  </g>

  <!-- revisão aprovada -->
  <circle cx="602" cy="330" r="20" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".4" />
  <path d="M593 330l6.5 6.5L612 323" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <rect width="800" height="440" fill="url(#vig)" />
</svg>
