<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" fill="none">
  <!-- LZdev · SEO otimizado — busca, primeira posição e curva de tráfego.
       Acento: azul categórico (cat-1). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141821" />
      <stop offset="1" stop-color="#05060a" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" stroke="#ffffff" stroke-opacity=".05" />
    </pattern>
    <radialGradient id="glow" cx=".5" cy="0" r=".85">
      <stop offset="0" stop-color="#60a5fa" stop-opacity=".2" />
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".42" r=".72">
      <stop offset=".5" stop-color="#05060a" stop-opacity="0" />
      <stop offset="1" stop-color="#05060a" stop-opacity=".7" />
    </radialGradient>
  </defs>

  <rect width="800" height="440" fill="url(#bg)" />
  <rect width="800" height="440" fill="url(#grid)" />
  <rect width="800" height="440" fill="url(#glow)" />

  <!-- curva de tráfego ao fundo -->
  <path d="M56 402L180 364 300 334 420 302 540 252 660 202 744 162V440H56z" fill="#60a5fa" fill-opacity=".05" />
  <path d="M56 402l124-38 120-30 120-32 120-50 120-50 84-40" stroke="#60a5fa" stroke-opacity=".2" stroke-width="3" stroke-linecap="round" />
  <g fill="#60a5fa" fill-opacity=".3">
    <circle cx="180" cy="364" r="4" />
    <circle cx="300" cy="334" r="4" />
    <circle cx="420" cy="302" r="4" />
    <circle cx="540" cy="252" r="4" />
    <circle cx="660" cy="202" r="4" />
  </g>

  <!-- campo de busca -->
  <rect x="150" y="78" width="500" height="52" rx="26" fill="#0a0c11" fill-opacity=".9" stroke="#ffffff" stroke-opacity=".12" />
  <g stroke="#ffffff" stroke-opacity=".45" stroke-width="2.6" stroke-linecap="round">
    <circle cx="187" cy="102" r="9.5" />
    <path d="M194 109l7.5 7.5" />
  </g>
  <rect x="218" y="99" width="172" height="10" rx="5" fill="#ffffff" fill-opacity=".22" />
  <rect x="594" y="92" width="38" height="24" rx="10" fill="#60a5fa" fill-opacity=".85" />

  <!-- resultado 1: o seu -->
  <rect x="150" y="156" width="500" height="78" rx="14" fill="#0a0c11" stroke="#60a5fa" stroke-opacity=".35" />
  <rect x="150" y="156" width="500" height="78" rx="14" fill="#60a5fa" fill-opacity=".08" />
  <circle cx="184" cy="195" r="16" fill="#60a5fa" fill-opacity=".9" />
  <text x="184" y="201" text-anchor="middle" font-family="'Plus Jakarta Sans', Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#05060a">1</text>
  <rect x="214" y="176" width="232" height="12" rx="6" fill="#ffffff" fill-opacity=".38" />
  <rect x="214" y="198" width="152" height="8" rx="4" fill="#60a5fa" fill-opacity=".5" />
  <rect x="214" y="214" width="300" height="7" rx="3.5" fill="#ffffff" fill-opacity=".12" />

  <!-- resultados 2 e 3 -->
  <g>
    <rect x="150" y="246" width="500" height="62" rx="14" fill="#0a0c11" fill-opacity=".75" stroke="#ffffff" stroke-opacity=".07" />
    <circle cx="184" cy="277" r="14" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".1" />
    <text x="184" y="282" text-anchor="middle" font-family="'Plus Jakarta Sans', Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" fill-opacity=".35">2</text>
    <rect x="214" y="263" width="180" height="10" rx="5" fill="#ffffff" fill-opacity=".16" />
    <rect x="214" y="283" width="260" height="7" rx="3.5" fill="#ffffff" fill-opacity=".09" />
  </g>
  <g>
    <rect x="150" y="320" width="500" height="62" rx="14" fill="#0a0c11" fill-opacity=".75" stroke="#ffffff" stroke-opacity=".07" />
    <circle cx="184" cy="351" r="14" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".1" />
    <text x="184" y="356" text-anchor="middle" font-family="'Plus Jakarta Sans', Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" fill-opacity=".35">3</text>
    <rect x="214" y="337" width="150" height="10" rx="5" fill="#ffffff" fill-opacity=".16" />
    <rect x="214" y="357" width="222" height="7" rx="3.5" fill="#ffffff" fill-opacity=".09" />
  </g>

  <rect width="800" height="440" fill="url(#vig)" />
</svg>
