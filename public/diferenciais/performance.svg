<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" fill="none">
  <!-- LZdev · Performance e velocidade — medidor de desempenho no verde.
       Acento: ciano categórico (cat-2). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141821" />
      <stop offset="1" stop-color="#05060a" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" stroke="#ffffff" stroke-opacity=".05" />
    </pattern>
    <radialGradient id="glow" cx=".5" cy="0" r=".85">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".2" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".42" r=".72">
      <stop offset=".5" stop-color="#05060a" stop-opacity="0" />
      <stop offset="1" stop-color="#05060a" stop-opacity=".7" />
    </radialGradient>
  </defs>

  <rect width="800" height="440" fill="url(#bg)" />
  <rect width="800" height="440" fill="url(#grid)" />
  <rect width="800" height="440" fill="url(#glow)" />

  <!-- métricas de apoio -->
  <g fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08">
    <rect x="86" y="96" width="152" height="46" rx="12" />
    <rect x="562" y="96" width="152" height="46" rx="12" />
  </g>
  <g fill="#22d3ee" fill-opacity=".75">
    <circle cx="108" cy="119" r="6" />
    <circle cx="584" cy="119" r="6" />
  </g>
  <g fill="#ffffff">
    <g fill-opacity=".2">
      <rect x="126" y="108" width="82" height="7" rx="3.5" />
      <rect x="602" y="108" width="82" height="7" rx="3.5" />
    </g>
    <g fill-opacity=".1">
      <rect x="126" y="124" width="52" height="6" rx="3" />
      <rect x="602" y="124" width="52" height="6" rx="3" />
    </g>
  </g>

  <!-- marcações do medidor -->
  <g stroke="#ffffff" stroke-opacity=".18" stroke-linecap="round">
    <path d="M266 300h10M276.2 248.7l9.2 3.8M305.3 205.3l7 7M348.7 176.2l3.8 9.2M400 166v10M451.3 176.2l-3.8 9.2M494.7 205.3l-7 7M523.8 248.7l-9.2 3.8M534 300h-10" />
  </g>

  <!-- arco: trilha e preenchimento -->
  <path d="M250 300a150 150 0 0 1 300 0" stroke="#ffffff" stroke-opacity=".1" stroke-width="18" stroke-linecap="round" />
  <path d="M250 300A150 150 0 0 1 539.5 244.8" stroke="#22d3ee" stroke-width="18" stroke-linecap="round" />

  <!-- ponteiro -->
  <path d="M400 300l102-40.5" stroke="#ffffff" stroke-opacity=".9" stroke-width="4" stroke-linecap="round" />
  <circle cx="400" cy="300" r="11" fill="#05060a" stroke="#ffffff" stroke-opacity=".3" stroke-width="2" />
  <circle cx="400" cy="300" r="4" fill="#22d3ee" />

  <!-- pontuação -->
  <text x="400" y="284" text-anchor="middle" font-family="'Plus Jakarta Sans', Inter, system-ui, sans-serif" font-size="88" font-weight="800" fill="#ffffff" letter-spacing="-3">98</text>

  <!-- evolução -->
  <g>
    <rect x="352" y="376" width="24" height="22" rx="5" fill="#ffffff" fill-opacity=".14" />
    <rect x="388" y="360" width="24" height="38" rx="5" fill="#ffffff" fill-opacity=".2" />
    <rect x="424" y="342" width="24" height="56" rx="5" fill="#22d3ee" fill-opacity=".75" />
  </g>

  <rect width="800" height="440" fill="url(#vig)" />
</svg>
